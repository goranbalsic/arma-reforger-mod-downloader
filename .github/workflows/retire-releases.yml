name: Retire superseded releases
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: retire-superseded-releases
jobs:
  retire:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Keep the latest release and preserve Git tags
        shell: bash
        run: |
          set -euo pipefail
          latest=$(gh api "repos/$GH_REPO/releases/latest")
          jq -e 'any(.assets[]; .name == "ReforgerModDownloader.exe" and .state == "uploaded" and .size > 0)' <<< "$latest" >/dev/null
          keep=$(jq -r .id <<< "$latest")
          published=$(jq -r .published_at <<< "$latest")
          ids=$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" | jq -r --argjson keep "$keep" --arg date "$published" '.[] | select(.draft == false and .id != $keep and .published_at <= $date) | .id')
          for id in $ids; do
            [[ $(gh api "repos/$GH_REPO/releases/latest" --jq .id) == "$keep" ]] || exit 1
            gh api --method DELETE "repos/$GH_REPO/releases/$id"
          done
