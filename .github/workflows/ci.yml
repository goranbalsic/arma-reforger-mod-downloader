name: ci

on:
  push:
    branches: [main, linux-desktop]
  pull_request:
  workflow_dispatch:

jobs:
  linux-desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK and WebKit
        run: |
          sudo apt-get update
          sudo apt-get install -y gir1.2-gtk-3.0 gir1.2-webkit2-4.1 python3-gi xvfb xauth
      - name: Package Linux desktop app
        run: sh linux/package.sh
      - name: Open the packaged app with a fixture queue
        run: |
          tar xzf dist/ReforgerModDownloader-linux-x64.tar.gz -C "$RUNNER_TEMP"
          cp linux/test-desktop.py "$RUNNER_TEMP/ReforgerModDownloader/"
          xvfb-run -a /usr/bin/python3 "$RUNNER_TEMP/ReforgerModDownloader/test-desktop.py"
      - uses: actions/upload-artifact@v4
        with:
          name: ReforgerModDownloader-linux-x64
          path: dist/ReforgerModDownloader-linux-x64.tar.gz
          if-no-files-found: error

  desktop:
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - name: Build desktop executable
        shell: powershell
        run: .\desktop\Build.ps1
      - name: Test the desktop transport
        shell: powershell
        run: .\desktop\Test.ps1
      - name: Attest the executable built on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/ReforgerModDownloader.exe
      - uses: actions/upload-artifact@v4
        with:
          name: ReforgerModDownloader-windows-x64
          path: dist/ReforgerModDownloader.exe
          if-no-files-found: error

  audit:
    # the tool targets Windows PowerShell 5.1, so the gate runs on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer for Windows PowerShell
        shell: powershell
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -AllowClobber
          (Get-Module -ListAvailable PSScriptAnalyzer | Select-Object -First 1).Version

      - name: Audit (parse, analyzer, unit tests)
        shell: powershell
        # exit 0 PASS, 1 FAIL, 2 INCOMPLETE (a mandatory check could not run)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\tools\audit.ps1

      - name: Audit status semantics (FAIL and INCOMPLETE fixtures)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\tools\test-audit.ps1
