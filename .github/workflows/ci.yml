name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    # the tool targets Windows PowerShell 5.1, so the gate runs on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse every PowerShell script
        shell: powershell
        run: |
          $bad = 0
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors)
            if ($errors.Count) {
              $bad++
              Write-Host "FAIL $($_.Name)"
              $errors | ForEach-Object { Write-Host "  line $($_.Extent.StartLineNumber): $($_.Message)" }
            } else {
              Write-Host "ok   $($_.Name)"
            }
          }
          if ($bad) { exit 1 }

      - name: PSScriptAnalyzer (errors only)
        shell: powershell
        run: |
          # if this cannot run, the job fails - a skipped check is not a pass
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -AllowClobber -Confirm:$false
          Import-Module PSScriptAnalyzer
          $bad = @(Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error)
          Write-Host "PSScriptAnalyzer errors: $($bad.Count)"
          $bad | Format-Table RuleName, ScriptName, Line, Message -AutoSize | Out-String | Write-Host
          # warnings are reported, not enforced
          $warn = @(Invoke-ScriptAnalyzer -Path . -Recurse -Severity Warning)
          Write-Host "PSScriptAnalyzer warnings (not enforced): $($warn.Count)"
          if ($bad.Count) { exit 1 }

      - name: Unit tests (offline)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\test-units.ps1
